name: CI

# Mesmo CI do tema Canela, ajustado ao Backup: PHP (testes unitários, lint,
# PHPStan, auditoria) numa matriz de versões e do flarum/core, a transferência
# real de banco entre motores, auditoria do npm e paridade das traduções. Os
# testes de integração com flarum/testing ficam no backend.yml, o workflow do
# core/FoF.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Segunda 05:00 UTC: roda mesmo sem push. Como as dependências vêm de
  # `composer update`, isso testa contra o flarum/core mais novo e pega
  # quebras de uma versão nova do Flarum antes de chegarem ao fórum.
  schedule:
    - cron: '0 5 * * 1'

# Nega tudo ao GITHUB_TOKEN por padrão; cada job declara o que precisa.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Valida o composer.json como está no repositório (antes de a matriz mexer
  # na versão do core).
  composer-validate:
    name: composer validate (--strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validar composer.json
        # Sem campo "version": as versões vêm das tags do git.
        run: composer validate --strict --no-check-publish

  php:
    name: PHP ${{ matrix.php }} × flarum/core ${{ matrix.flarum-core }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # O flarum/core 2.x exige PHP ^8.3. O fórum de desenvolvimento roda 8.5.
        php: ['8.3', '8.4', '8.5']
        # A versão estável E a ponta do core.
        flarum-core:
          - '^2.0.0'
          - '2.x-dev'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, fileinfo, gd, pdo_mysql, pdo_pgsql, pdo_sqlite, sodium
          coverage: none
          tools: composer:v2

      - name: Fixar o flarum/core desta célula
        run: composer require --no-update "flarum/core:${{ matrix.flarum-core }}"

      - name: Resolver dependências (composer update)
        # --ignore-platform-req=php+ ignora só o limite SUPERIOR de PHP (para a
        # célula 8.5, se alguma dependência ainda não declarar suporte).
        run: composer update --no-interaction --no-progress --prefer-stable --no-scripts --ignore-platform-req=php+

      - name: Testes unitários
        run: vendor/bin/phpunit -c tests/phpunit.unit.xml --testsuite unit

      - name: Lint PHP (php -l)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src migrations extend.php tests -name '*.php' -print0 2>/dev/null)
          [ "${#files[@]}" -gt 0 ] || { echo "Nenhum arquivo PHP encontrado"; exit 1; }
          printf '%s\0' "${files[@]}" | xargs -0 -n1 -P4 php -l

      - name: composer audit
        run: composer audit --no-dev --format=plain

      # PHPStan nível 6 com a extensão do Flarum (flarum/phpstan), sem
      # baseline: o mesmo padrão do core e da FoF.
      - name: PHPStan
        if: matrix.php == '8.3' && matrix.flarum-core == '^2.0.0'
        run: composer analyse:phpstan

  # Dump e restore reais entre MySQL, MariaDB, PostgreSQL e SQLite. Um par
  # (origem → destino) só roda quando os dois motores estão no ar: os jobs por
  # motor fixam a versão do servidor e cobrem o par com o SQLite (sempre
  # disponível); o `transfer-all-directions` sobe os quatro juntos e roda a
  # matriz completa.
  transfer-mysql:
    name: Transferência · MySQL ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['8.0', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.version }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: backup_xfer_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      BACKUP_TEST_MYSQL: 'host=127.0.0.1;port=3306;username=root;password=root;database=backup_xfer_test'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, intl, gd, bcmath, sodium
          coverage: none
          tools: composer:v2

      - name: Resolver dependências (composer update)
        run: composer update --no-interaction --no-progress --prefer-stable --no-scripts

      - name: Transferência entre motores
        run: vendor/bin/phpunit -c tests/phpunit.transfer.xml --testdox

  transfer-mariadb:
    name: Transferência · MariaDB ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['10.11', '11.4']
    services:
      mariadb:
        image: mariadb:${{ matrix.version }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: backup_xfer_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      # O driver `mariadb` do illuminate faz a conexão se apresentar como
      # mariadb, o caminho que já regrediu.
      BACKUP_TEST_MARIADB: 'host=127.0.0.1;port=3306;username=root;password=root;database=backup_xfer_test'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, intl, gd, bcmath, sodium
          coverage: none
          tools: composer:v2

      - name: Resolver dependências (composer update)
        run: composer update --no-interaction --no-progress --prefer-stable --no-scripts

      - name: Transferência entre motores
        run: vendor/bin/phpunit -c tests/phpunit.transfer.xml --testdox

  transfer-postgres:
    name: Transferência · PostgreSQL ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['14', '16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backup_xfer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      BACKUP_TEST_POSTGRES: 'host=127.0.0.1;port=5432;username=postgres;password=postgres;database=backup_xfer_test'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, intl, gd, bcmath, sodium
          coverage: none
          tools: composer:v2

      - name: Resolver dependências (composer update)
        run: composer update --no-interaction --no-progress --prefer-stable --no-scripts

      - name: Transferência entre motores
        run: vendor/bin/phpunit -c tests/phpunit.transfer.xml --testdox

  transfer-all-directions:
    name: Transferência · todas as direções
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: backup_xfer_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: backup_xfer_test
        ports:
          # 3307 no host para não colidir com o 3306 do mysql.
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backup_xfer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      BACKUP_TEST_MYSQL: 'host=127.0.0.1;port=3306;username=root;password=root;database=backup_xfer_test'
      BACKUP_TEST_MARIADB: 'host=127.0.0.1;port=3307;username=root;password=root;database=backup_xfer_test'
      BACKUP_TEST_POSTGRES: 'host=127.0.0.1;port=5432;username=postgres;password=postgres;database=backup_xfer_test'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, intl, gd, bcmath, sodium
          coverage: none
          tools: composer:v2

      - name: Resolver dependências (composer update)
        run: composer update --no-interaction --no-progress --prefer-stable --no-scripts

      - name: Transferência entre motores
        run: vendor/bin/phpunit -c tests/phpunit.transfer.xml --testdox

  # Formatação, tipos e build ficam no frontend.yml (o workflow do core);
  # aqui só a auditoria das dependências JS.
  js:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: js/package-lock.json

      # Todo o node_modules é de build: o pacote publicado é js/dist/*.js.
      # Bloqueia só o que chegaria à produção; o resto fica visível no log.
      - name: npm audit (produção — bloqueia)
        working-directory: js
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit (dev — informativo)
        working-directory: js
        continue-on-error: true
        run: npm audit --audit-level=high

  # Paridade das traduções (en ↔ pt-BR): não depende da versão do PHP/core.
  locale:
    name: Paridade das traduções
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring
          coverage: none
          tools: composer:v2

      - name: Resolver dependências (composer update)
        run: composer update --no-interaction --no-progress --prefer-stable --no-scripts

      - name: Chaves en ↔ pt-BR
        run: vendor/bin/phpunit -c tests/phpunit.unit.xml --testsuite locale

  # Reprova PRs que tragam dependências com vulnerabilidade conhecida. Só em
  # repositório público: no privado a ação exige o GitHub Advanced Security
  # (lá o `composer audit` da matriz já cobre as dependências PHP).
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.repository.private
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
