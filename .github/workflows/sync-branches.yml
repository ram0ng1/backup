name: Sincronizar Branches com Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-branches
  cancel-in-progress: false

jobs:
  sync:
    name: Sincronizar branches com main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout do repositório
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sincronizar branches com main
        run: |
          git fetch --all

          BRANCHES=$(git branch -r \
            | grep -v 'HEAD' \
            | grep -v 'origin/main' \
            | grep -v 'origin/copilot/' \
            | grep -v 'origin/dependabot/' \
            | grep -v 'origin/claude/' \
            | sed 's|origin/||' \
            | tr -d ' ')

          for branch in $BRANCHES; do
            echo "▶ Sincronizando branch: $branch"

            git checkout -B "$branch" "origin/$branch"

            if ! git merge-base origin/main "origin/$branch" >/dev/null 2>&1; then
              echo "⚠️  '$branch' não compartilha histórico com main (pré-reescrita) — pulando"
              continue
            fi

            if git merge origin/main --no-edit -m "chore: sync with main"; then
              git push origin "$branch"
              echo "✅ Branch '$branch' sincronizada com sucesso"
            else
              echo "⚠️  Conflito ao sincronizar '$branch' com main — pulando"
              git merge --abort 2>/dev/null || true
            fi
          done
