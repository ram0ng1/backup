name: PR Labeler

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Nega tudo ao GITHUB_TOKEN por padrão; o job declara o que precisa.
permissions: {}

# Um PR sincronizado várias vezes seguidas não empilha execuções.
concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label_pr:
    name: Aplicar Labels no PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # O job aplica labels com o GITHUB_TOKEN.
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443

      - name: Aplicar label baseada na branch
        uses: TimonVS/pr-labeler-action@f9c084306ce8b3f488a8f3ee1ccedc6da131d1af # v5.0.0
        with:
          configuration-path: .github/pr-labeler.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
