name: CodeQL

# CodeQL (JS/TS). O CodeQL não suporta PHP; a cobertura
# de PHP é feita por PHPStan (ci.yml) e pelas regras Semgrep (security.yml).
#
# NOTA: code scanning em repositório privado exige GitHub Advanced Security.
# Sem GHAS o passo `analyze` aborta com "Code scanning is not enabled". Os
# passos `init`/`analyze` levam `continue-on-error: true` para não derrubar a
# CI até o GHAS ser habilitado — quando for, o job volta a valer sozinho.
# Enquanto isso, a cobertura SAST de JS/TS fica por conta do Semgrep
# (security.yml: ruleset `p/javascript` + regras Flarum v2).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'  # toda segunda, 06:00 UTC

# Nega tudo ao GITHUB_TOKEN por padrão; o job declara o que precisa.
permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analisar (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Inicializar CodeQL
        # continue-on-error: requer GHAS em repo privado (ver nota no topo).
        continue-on-error: true
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Analisar
        # continue-on-error: requer GHAS em repo privado (ver nota no topo).
        continue-on-error: true
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
