      reconciling: "Reconciliando os arquivos do projeto…"
      restoring: "Restaurando o banco…"
      restoring_percent: "Restaurando o banco… {percent}%"
      restored: "Banco restaurado."
      rewriting: "Reescrevendo URLs…"
      rewrote_url: "URL reescrita: {from} → {to}"
      skipping_rewrite: "URLs não reescritas (iguais ou desconhecidas)."
      complete: "Restauração concluída."
      finished_dangling: "Restauração terminada — o extend.php da raiz referencia classes que não estão instaladas."
      finished_unwritable: "Restauração terminada — {count, plural, one {# arquivo não pôde ser gravado} other {# arquivos não puderam ser gravados}} no disco."
      finished_unresolved: "Restauração terminada com {count, plural, one {# entrada não restaurada} other {# entradas não restauradas}}."
      reconcile_failed: "Falha ao reconciliar os arquivos da raiz do projeto: {error}. O composer.json e o extend.php deste servidor ficaram como estavam."
      preserved_reapply_failed: "Não foi possível regravar a configuração deste servidor após o restore: {error}. Reveja SMTP, fila e integrações no painel."
      preserved_restored: "{count, plural, one {# configuração deste servidor foi preservada} other {# configurações deste servidor foram preservadas}} do backup (SMTP, fila, integrações). Ajuste a lista em `{key}` se algo específico do seu ambiente ainda estiver sendo sobrescrito."
      boot_at_risk: "BOOT EM RISCO: o extend.php da raiz referencia {count, plural, one {a classe {classes}} other {as classes {classes}}} que o autoloader não resolve. O Flarum carrega esse arquivo antes do handler de erro, então isso derruba o fórum com HTTP 500 sem mensagem. Reinstale o pacote que fornece a classe ou comente o extender antes de recarregar."
      unwritable_destination: "Sem permissão de escrita em {paths} (o PHP roda como `{user}`). As entradas destinadas a esses caminhos NÃO serão gravadas — o banco, os assets e o storage continuam. Ajuste o dono/permissão desses diretórios e restaure de novo, ou desmarque Extensões e instale os pacotes pelo composer."
      incomplete_unresolved: "Restauração INCOMPLETA: {count, plural, one {# entrada selecionada não pôde ser gravada} other {# entradas selecionadas não puderam ser gravadas}} porque o destino não resolveu{sample}. Confira a integridade do arquivo e o manifesto de extensões antes de considerar esta migração concluída."
      incomplete_unwritable: "Restauração INCOMPLETA: {count, plural, one {# arquivo não pôde ser gravado} other {# arquivos não puderam ser gravados}} pelo usuário `{user}` do PHP{sample}. Corrija dono/permissão (ou espaço em disco) desses caminhos e restaure de novo — o banco de dados já foi aplicado, então basta repetir o restore com apenas Extensões marcado."
      mkdir_failed: "não foi possível criar {dir}"
      fopen_failed: "fopen recusou o destino"

    project:
      incoming_invalid_json: "O composer.json do arquivo não é JSON válido — manifesto do destino mantido intacto."
      local_invalid_json: "O composer.json deste servidor não é JSON válido — merge abortado para não piorar o estado."
      encode_failed: "Falha ao serializar o composer.json unido — manifesto do destino mantido intacto."
      write_failed: "Não foi possível gravar o composer.json unido (permissão?)."
      merged: "composer.json unido ao do destino (nada foi removido). O composer.lock do arquivo NÃO foi aplicado: um lock de outro servidor poda pacotes que só existem aqui. Rode `composer update --lock` para regravar o lock local."
      fresh_manifest: "Servidor sem composer.json — manifesto e lock do arquivo aplicados verbatim. Rode `composer install`."
      only_here: "Pacotes que existem só neste servidor e NÃO estavam no backup (preservados pelo merge): {packages}. Confirme que o extend.php da raiz e as extensões restauradas continuam compatíveis com eles."
      only_there: "Pacotes exigidos pelo backup e ausentes deste servidor: {packages}. Rode `composer install` para materializá-los antes de considerar a migração concluída."
      extend_write_failed: "Não foi possível gravar o extend.php da raiz (permissão?)."
      extend_replaced: "extend.php da raiz substituído pelo do backup (cópia do anterior salva como .bak-*)."

    stack:
      php_too_old: "Backup gerado em PHP {source}; este servidor roda PHP {here}. Não é possível continuar: o código que o arquivo carrega (vendor/, extensões e o composer.lock que as resolveu) foi montado para PHP {source} e pode usar sintaxe que o parser do PHP {here} recusa — a restauração deixaria o Flarum sem subir. Atualize este servidor para PHP {source} ou superior, ou gere o backup a partir de uma instalação em PHP {here}."
      missing_extensions: "Não é possível continuar: este servidor não tem {count, plural, one {uma extensão PHP obrigatória} other {extensões PHP obrigatórias}} que a origem do backup tinha — {extensions}. Sem {count, plural, one {ela} other {elas}} o Flarum não sobe depois da restauração. Habilite-{count, plural, one {a} other {as}} no PHP deste servidor e tente novamente."
      composer_update: "O composer.lock deste backup foi resolvido em PHP {source} e este servidor roda PHP {here}. Rode `composer update` na raiz da instalação para reresolver as dependências para a versão local."

