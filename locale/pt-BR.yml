ramon-backup:
  admin:
    permissions:
      manage_label: "Gerenciar backups"

    panel:
      actions_title: "Backup e migração"
      actions_help: "Crie um arquivo portátil do seu fórum, restaure a partir de um, ou transfira entre instalações Flarum."
      create_button: "Criar backup"
      import_button: "Importar backup"
      list_title: "Backups salvos"

    list:
      empty: "Nenhum backup ainda. Clique em 'Criar backup' para fazer um."
      col_when: "Quando"
      col_size: "Tamanho"
      col_contents: "Conteúdo"
      col_status: "Criptografia"
      content_db: "Banco de dados"
      content_assets: "Assets"
      content_storage: "Storage"
      content_extensions: "Extensões"
      encrypted: "Criptografado"
      plain: "Sem criptografia"
      download_title: "Baixar"
      delete_title: "Excluir"
      confirm_delete: "Excluir este backup permanentemente? O arquivo .flarum será removido do servidor."
      deleted: "Backup excluído."
      delete_failed: "Não foi possível excluir o backup."

    encryption:
      section_title: "Criptografia"
      section_help: "Criptografe novos backups com um par de chaves assimétrico. A chave pública fica no banco de dados; a privada DEVE ser colada no config.php — o processo web nunca recebe uma chave que não foi explicitamente configurada."
      status:
        unknown: "Não foi possível carregar o status da criptografia."
        libsodium_missing: "libsodium não está disponível neste servidor. A criptografia não pode ser habilitada."
        healthy: "Criptografia configurada. Novos backups serão criptografados automaticamente quando você marcar 'criptografar' no modal de exportação."
        not_setup: "Nenhum par de chaves foi gerado. Backups serão salvos em texto puro a menos que você ative a criptografia por exportação."
        public_key_label: "Chave pública"
        private_key_label: "Chave privada (config.php)"
        present: "Presente"
        absent: "Ausente"
        mismatch_title: "Chaves não pareadas"
        mismatch_body: "A chave privada no config.php não corresponde à chave pública armazenada no banco. Backups criptografados existentes não podem ser descriptografados neste servidor. Restaure a chave privada original ou gere um novo par de chaves (os arquivos antigos permanecem inalterados mas ilegíveis aqui)."
        private_missing_title: "Chave privada ausente"
        private_missing_body: "Foi gerada uma chave pública, mas a chave privada correspondente não está no seu config.php. Backups criptografados existentes não serão descriptografados aqui até que a chave privada seja restaurada."
      actions:
        generate: "Gerar par de chaves"
      public_key:
        label: "Chave pública atual"
        copy_title: "Copiar chave pública"
        copied: "Copiada!"
        help_healthy: "Novos backups criptografados serão selados com esta chave. Qualquer pessoa com a chave privada correspondente pode descriptografar."
        help_broken: "Criptografia configurada mas não consegue descriptografar — veja o alerta acima."
        remove_button: "Rotacionar par de chaves"
      reveal_modal:
        title: "Salve sua chave privada"
        intro: "Acabamos de gerar um novo par de chaves. A metade privada é mostrada UMA VEZ abaixo. Cole no seu config.php — não conseguiremos mostrá-la novamente."
        warning_title: "Não perca esta chave"
        warning_body: "Se você perder a chave privada, todo backup criptografado com a chave pública correspondente se torna permanentemente ilegível."
        snippet_label: "Adicione esta linha ao config.php:"
        copy_button: "Copiar trecho"
        copied: "Copiado!"
        close: "Salvei minha chave privada"
      regenerate_modal:
        title: "Rotacionar par de chaves"
        warning: "Gerar um novo par de chaves deixa qualquer backup já criptografado com a chave pública ANTIGA ilegível neste servidor (ainda é possível descriptografá-los externamente se você salvou a chave privada antiga). Novos backups serão criptografados com a nova chave."
        acknowledge: "Entendi e desejo rotacionar."
        submit: "Gerar novo par de chaves"

    export_modal:
      title: "Criar backup"
      intro: "Escolha o que incluir. O resultado é um único arquivo .flarum que você pode baixar, transferir ou armazenar fora do servidor."
      contents_title: "O que incluir"
      content_db: "Banco de dados"
      content_db_help: "Todas as tabelas — usuários, posts, configurações, etc. O dump inclui DROP/CREATE para que possa ser restaurado de forma limpa."
      content_assets: "Assets (uploads)"
      content_assets_help: "public/assets/ — avatares, anexos, qualquer arquivo enviado por usuários."
      content_storage: "Storage (cache, sessões, logs)"
      content_storage_help: "Geralmente ignorado: contém arquivos de runtime que podem ser regenerados e raramente são portáteis entre instalações."
      content_extensions: "Extensões (workbench/)"
      content_extensions_help: "Código de extensões locais em workbench/. Ignore ao restaurar em um servidor que já gerencia extensões via composer."
      encryption_title: "Criptografia"
      encryption_enable: "Criptografar este backup"
      encryption_help: "Usa criptografia híbrida via libsodium. O corpo é criptografado com uma chave simétrica única por arquivo, que é então selada com uma chave pública."
      encryption_external: "Criptografar com uma chave pública diferente (para transferência)"
      encryption_external_help: "Cole a chave pública do servidor de destino. Útil ao preparar um backup para restaurar em outro lugar sem compartilhar chaves privadas."
      start_button: "Iniciar backup"
      start_failed: "Não foi possível iniciar a exportação."
      cancel_button: "Cancelar"
      close_button: "Fechar"
      completed: "Backup criado."
      files_count: "{done} / {total} arquivos"
      phase_scan: "Verificando…"
      phase_db_dump: "Exportando banco…"
      phase_bundle: "Empacotando arquivos…"
      phase_finalize: "Finalizando…"
      phase_done: "Pronto"
      phase_error: "Erro"

    import_modal:
      title: "Importar backup"
      warning_title: "Isto substituirá dados"
      warning_body: "Importar um backup sobrescreve o banco e substitui arquivos. Certifique-se de ter um backup recente DESTA instalação primeiro."
      choose_file: "Clique para escolher um arquivo .flarum"
      upload_button: "Enviar e inspecionar"
      upload_failed: "Falha no upload."
      inspect_title: "Detalhes do arquivo"
      meta_when: "Criado em"
      meta_flarum: "Versão do Flarum"
      meta_contents: "Inclui"
      meta_source_url: "URL de origem"
      meta_size: "Tamanho"
      key_title: "Chave privada"
      key_help: "Este arquivo está criptografado. Cole a chave privada base64 correspondente — ela fica somente nesta sessão do navegador e é enviada UMA VEZ ao servidor para a restauração."
      key_hint_local: "Deixe em branco para usar a chave privada configurada no config.php deste servidor."
      confirm_title: "Substituir dados existentes"
      confirm_body: "As tabelas do arquivo substituem as tabelas atuais. Arquivos são gravados em seus caminhos originais."
      confirm_check: "Eu entendo. Substituir meus dados atuais por este backup."
      start_button: "Restaurar"
      start_failed: "Não foi possível iniciar a restauração."
      cancel_button: "Cancelar"
      close_button: "Fechar"
      completed: "Restauração concluída."
      phase_inspect: "Inspecionando arquivo…"
      phase_extract: "Extraindo…"
      phase_restore: "Restaurando banco…"
      phase_rewrite: "Reescrevendo URLs…"
      phase_finalize: "Finalizando…"
      phase_done: "Pronto"
      phase_error: "Erro"
      url_rewrite_note: "URLs no banco que apontam para o servidor de origem serão reescritas automaticamente para a URL deste servidor."
