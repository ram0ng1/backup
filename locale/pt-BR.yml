      logout_body: "A restauração do banco substituiu as tabelas `users` e `sessions` deste servidor — a conta com que você estava logado não existe mais aqui. Faça login novamente com as credenciais do fórum de origem para continuar."
      logout_step_reload: "Recarregue a página abaixo para limpar o cookie de sessão antigo"
      logout_step_login: "Faça login com as credenciais de admin do fórum de origem"
      logout_button: "Recarregar e fazer login"
