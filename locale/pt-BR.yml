      rows_of: "{done, number}/{total, number} linhas"
      dump_complete: "Banco exportado. Empacotando…"
      bundling: "Empacotando arquivos…"
      bundling_files: "Empacotando arquivos… {done}/{total}"
      finalising: "Finalizando…"
      complete: "Backup concluído."
      file_changed: "{file} mudou durante o backup; os bytes que faltaram foram preenchidos com zeros."

    import:
      inspecting: "Inspecionando o arquivo…"
