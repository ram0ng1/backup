      content_assets: "Assets (uploads)"
      content_assets_help: "public/assets/ — avatares, anexos, qualquer arquivo enviado por usuários."
      content_storage: "Storage (cache, sessões, logs)"
      content_storage_help: "Geralmente ignorado: contém arquivos de runtime que podem ser regenerados e raramente são portáteis entre instalações."
      content_extensions: "Extensões"
      content_extensions_help: "Empacote os arquivos de uma ou mais extensões instaladas (do workbench/ ou vendor/). Marque a caixa e escolha quais abaixo."
      extensions_select_all: "Selecionar todas"
      extensions_select_none: "Desmarcar todas"
      extensions_none: "Nenhuma extensão está instalada neste Flarum."
      extensions_load_failed: "Não foi possível carregar a lista de extensões."
