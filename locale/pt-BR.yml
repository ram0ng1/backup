        generate: "Gerar par de chaves"
        generate_failed: "Não foi possível gerar o par de chaves."
      public_key:
        label: "Chave pública atual"
        copy_title: "Copiar chave pública"
        copied: "Copiada!"
        help_healthy: "Novos backups criptografados serão selados com esta chave. Qualquer pessoa com a chave privada correspondente pode descriptografar."
        help_broken: "Criptografia configurada mas não consegue descriptografar — veja o alerta acima."
        remove_button: "Rotacionar par de chaves"
      reveal_modal:
        title: "Salve sua chave privada"
        intro: "Acabamos de gerar um novo par de chaves. A metade privada é mostrada UMA VEZ abaixo. Cole no seu config.php — não conseguiremos mostrá-la novamente."
        warning_title: "Não perca esta chave"
        warning_body: "Se você perder a chave privada, todo backup criptografado com a chave pública correspondente se torna permanentemente ilegível."
        snippet_label: "Adicione esta linha ao config.php:"
        copy_button: "Copiar trecho"
        copied: "Copiado!"
        close: "Salvei minha chave privada"
      regenerate_modal:
        title: "Rotacionar par de chaves"
        warning: "Gerar um novo par de chaves deixa qualquer backup já criptografado com a chave pública ANTIGA ilegível neste servidor (ainda é possível descriptografá-los externamente se você salvou a chave privada antiga). Novos backups serão criptografados com a nova chave."
